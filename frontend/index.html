<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstaken Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #eef3e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main chatbot */
        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            min-height: 500px;
            background: #fffdf8;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(71, 91, 65, 0.15);
            border: 1px solid #dfe6d8;
        }

        /* Header */
        .header {
            background: #dce8d4;
            color: #33432f;
            padding: 22px 25px;
            text-align: center;
            border-bottom: 1px solid #cddbc5;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 14px;
            color: #66745f;
        }

        /* Chat area */
        .messages {
            flex: 1;
            padding: 28px;
            overflow-y: auto;
            background: #fffdf8;
        }

        /* Message bubbles */
        .message {
            margin-bottom: 16px;
            padding: 13px 17px;
            border-radius: 17px;
            max-width: 78%;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .bot {
            background: #edf3e9;
            color: #394635;
            border: 1px solid #e1e9dc;
            border-bottom-left-radius: 5px;
        }

        .user {
            background: #b9cfad;
            color: #263322;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        /* Suggestions */
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin: 4px 0 22px 0;
        }

        .suggestion-btn {
            background: #f4ead8;
            color: #56604c;
            border: 1px solid #e4d7c1;
            padding: 9px 14px;
            border-radius: 18px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .suggestion-btn:hover {
            background: #e8dfcd;
            border-color: #cfc2aa;
            transform: translateY(-1px);
        }

        /* Input area */
        .input-area {
            display: flex;
            padding: 16px 18px;
            border-top: 1px solid #e3e5dc;
            background: #f8f5ec;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px 16px;
            border: 1px solid #d4ddcf;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            background: #fffdf8;
            color: #354031;
            outline: none;
        }

        input:focus {
            border-color: #a8bd9d;
            box-shadow: 0 0 0 3px rgba(168, 189, 157, 0.15);
        }

        input::placeholder {
            color: #9a9f95;
        }

        /* Send button */
        .send-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 14px;
            background: #8da982;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .send-btn:hover {
            background: #78966d;
        }

        /* Scrollbar */
        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #d0d9ca;
            border-radius: 10px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .chat-container {
                width: 100%;
                height: 90vh;
                border-radius: 18px;
            }

            .messages {
                padding: 20px;
            }

            .message {
                max-width: 88%;
            }

            .suggestion-btn {
                font-size: 12px;
                padding: 8px 11px;
            }

            .header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- Header -->
    <div class="header">
        <h1>📚 BooksTaken</h1>
        <p>Your reading journey, one conversation at a time.</p>
    </div>

    <!-- Messages -->
    <div class="messages" id="messages">

        <div class="message bot">
            Hi! I'm the Bookstaken assistant. How can I help you? 😊
        </div>

        <!-- Suggestion buttons -->
        <div class="suggestions">
            

            <button class="suggestion-btn" onclick="useSuggestion('Tell me about Bookstaken')">
                🌿 About Bookstaken
            </button>
            <button class="suggestion-btn" onclick="useSuggestion('Book a session with Bookstaken')">
                🌿 Book a session with Bookstaken
            </button>


            <button class="suggestion-btn" onclick="useSuggestion('What can you help me with?')">
                💬 What can you help with?
            </button>
        </div>

    </div>

    <!-- Input -->
    <div class="input-area">
        <input
            type="text"
            id="messageInput"
            placeholder="Ask something..."
            onkeydown="handleKeyPress(event)"
        >

        <button class="send-btn" onclick="sendMessage()">
            Send
        </button>
    </div>

</div>


<script>

    /* Suggestion button */
    function useSuggestion(text) {
        const input = document.getElementById("messageInput");

        input.value = text;
        sendMessage();
    }


    /* Enter key */
    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }


    /* Send message */
    async function sendMessage() {

        const input = document.getElementById("messageInput");
        const messages = document.getElementById("messages");

        const message = input.value.trim();

        if (!message) {
            return;
        }

        /* Add user message */
        messages.innerHTML += `
            <div class="message user">
                ${message}
            </div>
        `;

        input.value = "";

        /* Scroll down */
        messages.scrollTop = messages.scrollHeight;

        try {

            const response = await fetch(
                "/chat",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                }
            );

            const data = await response.json();

            /* Add bot response */
            messages.innerHTML += `
                <div class="message bot">
                    ${data.answer}
                </div>
            `;

        } catch (error) {

            messages.innerHTML += `
                <div class="message bot">
                    Sorry, something went wrong. Please try again.
                </div>
            `;

            console.error(error);
        }

        /* Scroll to latest message */
        messages.scrollTop = messages.scrollHeight;
    }

</script>

</body>
</html>
